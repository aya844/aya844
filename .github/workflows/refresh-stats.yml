name: Refresh GitHub Stats Cache

on:
  schedule:
    # Tous les jours à 00:17 UTC
    - cron: "17 0 * * *"

  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject cache-busting timestamp
        run: |
          TIMESTAMP=$(date +%s)

          echo "Timestamp: $TIMESTAMP"

          # GitHub Readme Stats
          sed -i -E "s|(github-readme-stats\.vercel\.app/api\?username=aya844[^\" ]*)|\1\&v=$TIMESTAMP|g" README.md

          # Top languages
          sed -i -E "s|(github-readme-stats\.vercel\.app/api/top-langs/\?username=aya844[^\" ]*)|\1\&v=$TIMESTAMP|g" README.md

          # Streak stats
          sed -i -E "s|(streak-stats\.demolab\.com\?user=aya844[^\" ]*)|\1\&v=$TIMESTAMP|g" README.md

      - name: Show changes
        run: |
          git diff -- README.md

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add README.md
            git commit -m "chore: refresh GitHub stats cache [skip ci]"
            git push
          fi
